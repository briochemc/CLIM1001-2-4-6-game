name = "clim1001-246-game"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "clim1001-246-game"
database_id = "4e2a7b53-9689-4300-afb6-3b4030058e88"

[vars]
# Class stats are hidden until this many people have finished (protects anonymity in small cohorts).
MIN_COHORT = "5"
# Comma-separated list of rules from src/rules.js. One rule keeps stats comparable;
# several reduce word-of-mouth leakage.
RULE_POOL = "ascending"

# Lets src/index.js import game.html as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
